name: Descoberta Travelpayouts
on:
  schedule:
    - cron: '47 6-22 * * *'   # de hora a hora (UTC), antes da atualização do site
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/tp_fetch.py', '.github/workflows/tp-fetch.yml']
permissions:
  contents: write
concurrency:
  group: tp-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tp_fetch.py
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
      - name: Guardar no main
        run: |
          git config user.name "voa-daqui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tp.json data/tp_hist.json
          git diff --cached --quiet && exit 0
          git commit -qm "Travelpayouts $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin main && exit 0
            sleep $((i * 7))
          done
          exit 1
