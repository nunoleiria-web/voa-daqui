<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voos baratos para o Brasil a partir de Portugal | Voa Daqui</title>
<meta name="description" content="Os 5 voos mais baratos de Lisboa, Porto e Faro para cada destino do Brasil: São Paulo, Rio, Salvador, Recife, Fortaleza e mais.">
<meta name="theme-color" content="#0a2540">
<link rel="canonical" href="https://voadaqui.pt/brasil.html">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="Voos baratos para o Brasil">
<meta property="og:description" content="Os 5 preços mais baixos para cada destino do Brasil, a partir de Lisboa, Porto e Faro.">
<meta property="og:image" content="https://voadaqui.pt/og.png">
<link rel="preload" href="assets/fonts/schibsted-grotesk.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:"Schibsted Grotesk";src:url("assets/fonts/schibsted-grotesk.woff") format("woff");font-weight:400 900;font-display:swap}
:root{--bg:#f4f6f9;--panel:#fff;--raise:#f7f9fb;--line:#e2e6ed;--ink:#0a2540;--muted:#5f6f88;--navy:#0a2540;--dim:#a9bad3;--sun:#ffc72c;--sun-ink:#1f1600;--blue:#1d5bd6;--blue-soft:#e8effc;--go:#067251}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08131f;--panel:#0f1f33;--raise:#13263d;--line:#1f3550;--ink:#eaf0f8;--muted:#8d9fb8;--navy:#050e19;--blue:#6b9cff;--blue-soft:#14284a;--go:#4ad6a7}}
:root[data-theme="dark"]{--bg:#08131f;--panel:#0f1f33;--raise:#13263d;--line:#1f3550;--ink:#eaf0f8;--muted:#8d9fb8;--navy:#050e19;--blue:#6b9cff;--blue-soft:#14284a;--go:#4ad6a7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hdr{background:var(--navy);color:#fff}
.hdr .in{max-width:1000px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.15rem;letter-spacing:-.025em;text-decoration:none}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--sun)}
.back{color:var(--dim);font-weight:600;font-size:.92rem;text-decoration:none}
.back:hover{color:#fff}
.band{background:var(--navy);color:#fff;padding:18px 0 72px}
.band .in{max-width:1000px;margin:0 auto;padding:0 16px}
h1{font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1.03;margin:0 0 10px;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--sun)}
.lead{color:var(--dim);font-size:1.06rem;margin:0;max-width:60ch}
main{max-width:1000px;margin:-52px auto 0;padding:0 16px 56px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.form{display:grid;gap:14px}
.lbl{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
select{font:inherit;color:var(--ink);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);width:100%;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 .9rem "Schibsted Grotesk",sans-serif;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);border-color:var(--blue);font-weight:700}
.top{background:var(--navy);color:#fff;border:0;display:grid;gap:4px}
.top .big{font-weight:900;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:-.03em;line-height:1.1}
.top .big b{color:var(--sun)}
.top p{margin:0;color:var(--dim)}
.list{display:grid;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.row h3{margin:0;font-size:1.05rem;letter-spacing:-.01em}
.row .sub{font-size:.86rem;color:var(--muted)}
.row .pr{text-align:right}
.row .pr b{display:block;font-size:1.5rem;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.row .pr small{font-size:.74rem;color:var(--muted)}
.row .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.tag.xmas{background:#fde7e7;color:#a11d1d}
.btn{font:700 .9rem "Schibsted Grotesk",sans-serif;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.small{font-size:.84rem;color:var(--muted);margin:0}
.dest{display:grid;gap:0;padding:0;overflow:hidden}.dest>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;background:var(--navy);color:#fff}.dest>header h2{margin:0;font-size:1.15rem;letter-spacing:-.02em}.dest>header b{color:var(--sun);font-size:1.3rem;font-weight:900}.dest>header small{color:var(--dim);font-weight:500;font-size:.8rem;margin-left:4px}.it{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}.it:first-of-type{border-top:0}.it .d{font-weight:600}.it .sub{font-size:.8rem;color:var(--muted)}.it .p{font-weight:900;font-size:1.15rem;font-variant-numeric:tabular-nums}.it .btn{padding:7px 11px;font-size:.84rem}@media(max-width:520px){.it{grid-template-columns:1fr auto}.it .btn{grid-column:1/-1;justify-content:center}}.empty{text-align:center;padding:30px 16px;color:var(--muted)}
</style>
</head>
<body>
<header class="hdr"><div class="in"><a class="logo" href="./"><i></i>Voa Daqui</a><a class="back" href="./">Voos a partir de Portugal</a></div></header>
<div class="band"><div class="in">
  <h1>Voos para o <em>Brasil</em></h1>
  <p class="lead">Todos os destinos do Brasil a partir de Lisboa, Porto e Faro, com os 5 preços mais baixos de cada um.</p>
</div></div>
<main>
  <section class="card form" aria-label="Escolhas">
    <div><span class="lbl">Partir de</span><div class="chips" id="from" role="group" aria-label="Origem"></div></div>
    <div><span class="lbl">Duração</span><div class="chips" id="len" role="group" aria-label="Duração">
      <button type="button" data-v="all" aria-pressed="true">Qualquer</button>
      <button type="button" data-v="short" aria-pressed="false">Até 15 noites</button>
      <button type="button" data-v="long" aria-pressed="false">16 a 35 noites</button>
    </div></div>
  </section>
  <section class="card top" id="top" aria-live="polite"></section>
  <div class="list" id="list"></div>
  <p class="small" id="note"></p>
</main>
<script src="assets/core.js"></script>
<script>
const ORI = [['all','Todas'],['LIS','Lisboa'],['OPO','Porto'],['FAO','Faro']], ONAME = {LIS:'Lisboa', OPO:'Porto', FAO:'Faro'};
const DN = {SAO:'São Paulo',RIO:'Rio de Janeiro',SSA:'Salvador',REC:'Recife',FOR:'Fortaleza',NAT:'Natal',BSB:'Brasília',BHZ:'Belo Horizonte',POA:'Porto Alegre',CWB:'Curitiba',MCZ:'Maceió',BEL:'Belém',MAO:'Manaus',FLN:'Florianópolis',VIX:'Vitória',SLZ:'São Luís',JPA:'João Pessoa',AJU:'Aracaju',THE:'Teresina',GYN:'Goiânia'};
const AL = {TP:'TAP',AD:'Azul',LA:'LATAM',G3:'GOL',IB:'Iberia',UX:'Air Europa',AF:'Air France',KL:'KLM',LH:'Lufthansa',BA:'British Airways',AT:'Royal Air Maroc',VR:'Cabo Verde Airlines',TK:'Turkish',EK:'Emirates',QR:'Qatar',ET:'Ethiopian',SV:'Saudia',LX:'Swiss',SN:'Brussels Airlines',AV:'Avianca',CM:'Copa',AR:'Aerolíneas',UA:'United',DL:'Delta',AA:'American',AC:'Air Canada',AZ:'ITA Airways',VY:'Vueling',FR:'Ryanair',U2:'easyJet'};
const dd = s => { const d = new Date(s.slice(0, 10) + 'T12:00'); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
const dash = s => `${s.slice(8, 10)}-${s.slice(5, 7)}-${s.slice(0, 4)}`;
const st = {from: 'all', len: 'all'};
try { Object.assign(st, JSON.parse(localStorage.getItem('voa-brasil') || '{}')); } catch (e){}
const qs = new URLSearchParams(location.search); if (ONAME[qs.get('de')]) st.from = qs.get('de');
$('from').innerHTML = ORI.map(([k, n]) => `<button type="button" data-v="${k}" aria-pressed="${k === st.from}">${esc(n)}</button>`).join('');
document.querySelectorAll('#len button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.len)));
let DATA = null;
function draw(){
  try { localStorage.setItem('voa-brasil', JSON.stringify(st)); } catch (e){}
  if (!DATA) return;
  let L = DATA.rows.filter(r => (st.from === 'all' || r.o === st.from) && (st.len === 'all' || (st.len === 'short' ? r.n <= 15 : r.n > 15)));
  L.sort((a, b) => a.p - b.p);
  const G = new Map();
  for (const r of L){ if (!G.has(r.to)) G.set(r.to, []); const g = G.get(r.to), k = r.o + r.dep.slice(0, 10) + r.ret.slice(0, 10); if (g.length < 5 && !g.some(x => x.o + x.dep.slice(0, 10) + x.ret.slice(0, 10) === k)) g.push(r); }
  const groups = [...G.entries()].sort((a, b) => a[1][0].p - b[1][0].p);
  $('top').innerHTML = groups.length ? `<div class="big">Brasil desde <b>${eur0(groups[0][1][0].p)}</b></div><p>${esc(DN[groups[0][0]] || groups[0][0])}, ida e volta, por pessoa. ${groups.length} destinos com preços.</p>` : `<div class="big">Sem preços para esta escolha</div><p>Experimenta "Todas" as origens ou "Qualquer" duração.</p>`;
  $('list').innerHTML = groups.length ? groups.map(([to, g]) => `<article class="card dest"><header><h2>${esc(DN[to] || to)}</h2><span>desde <b>${eur0(g[0].p)}</b></span></header>${g.map(r => { const al = r.al ? (AL[r.al] || r.al) : '';
    const url = `https://www.kiwi.com/deep?origin=${r.o}&destination=${r.to}&departure=${dash(r.dep)}&return=${dash(r.ret)}&adults=1&currency=EUR&lang=pt`;
    return `<div class="it"><div><div class="d">${dd(r.dep)} → ${dd(r.ret)}</div><div class="sub">${esc(ONAME[r.o])} · ${r.n} noites${al ? ' · ' + esc(al) : ''} · ${r.st === 0 ? 'direto' : (r.st <= 2 ? '1 escala' : 'escalas')}</div></div><div class="p">${eur0(r.p)}</div><a class="btn primary" href="${url}" target="_blank" rel="noopener">Confirmar</a></div>`; }).join('')}</article>`).join('')
    : '<div class="empty">Ainda não há voos guardados para esta combinação.</div>';
  const u = new Date(DATA.updated);
  $('note').textContent = `Preços vistos por outros viajantes nos últimos 2 dias (dados da Aviasales, recolhidos a ${u.getDate()} ${MO[u.getMonth()]}), por pessoa, ida e volta, normalmente sem mala de porão (confirma a bagagem). Podem já ter mudado: confirma sempre antes de comprar.`;
}
['from', 'len'].forEach(g => $(g).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st[g] = b.dataset.v; $(g).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw(); }));
fetch('data/brasil.json?v=' + Date.now()).then(r => r.json()).then(j => { DATA = j; draw(); }).catch(() => { $('top').innerHTML = '<div class="big">Os preços ainda não estão disponíveis</div><p>Volta daqui a pouco.</p>'; });
</script>
<script data-goatcounter="https://voadaqui.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
