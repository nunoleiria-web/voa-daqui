<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voltar a casa: voos baratos para Portugal no Natal | Voa Daqui</title>
<meta name="description" content="Voos baratos de Paris, Londres, Genebra, Luxemburgo, Bruxelas e outras cidades para Lisboa, Porto, Faro, Madeira e Açores. Natal, Ano Novo e próximas semanas.">
<meta name="theme-color" content="#0a2540">
<link rel="canonical" href="https://voadaqui.pt/casa.html">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="Voltar a casa: voos baratos para Portugal">
<meta property="og:description" content="Para quem vive lá fora: os voos mais baratos para casa no Natal e nas próximas semanas.">
<meta property="og:image" content="https://voadaqui.pt/og.png">
<link rel="preload" href="assets/fonts/schibsted-grotesk.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:"Schibsted Grotesk";src:url("assets/fonts/schibsted-grotesk.woff") format("woff");font-weight:400 900;font-display:swap}
:root{--bg:#f4f6f9;--panel:#fff;--raise:#f7f9fb;--line:#e2e6ed;--ink:#0a2540;--muted:#5f6f88;--navy:#0a2540;--dim:#a9bad3;--sun:#ffc72c;--sun-ink:#1f1600;--blue:#1d5bd6;--blue-soft:#e8effc;--go:#067251}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08131f;--panel:#0f1f33;--raise:#13263d;--line:#1f3550;--ink:#eaf0f8;--muted:#8d9fb8;--navy:#050e19;--blue:#6b9cff;--blue-soft:#14284a;--go:#4ad6a7}}
:root[data-theme="dark"]{--bg:#08131f;--panel:#0f1f33;--raise:#13263d;--line:#1f3550;--ink:#eaf0f8;--muted:#8d9fb8;--navy:#050e19;--blue:#6b9cff;--blue-soft:#14284a;--go:#4ad6a7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hdr{background:var(--navy);color:#fff}
.hdr .in{max-width:1000px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.15rem;letter-spacing:-.025em;text-decoration:none}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--sun)}
.back{color:var(--dim);font-weight:600;font-size:.92rem;text-decoration:none}
.back:hover{color:#fff}
.band{background:var(--navy);color:#fff;padding:18px 0 72px}
.band .in{max-width:1000px;margin:0 auto;padding:0 16px}
h1{font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1.03;margin:0 0 10px;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--sun)}
.lead{color:var(--dim);font-size:1.06rem;margin:0;max-width:60ch}
main{max-width:1000px;margin:-52px auto 0;padding:0 16px 56px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.form{display:grid;gap:14px}
.lbl{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
select{font:inherit;color:var(--ink);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);width:100%;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 .9rem "Schibsted Grotesk",sans-serif;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);border-color:var(--blue);font-weight:700}
.top{background:var(--navy);color:#fff;border:0;display:grid;gap:4px}
.top .big{font-weight:900;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:-.03em;line-height:1.1}
.top .big b{color:var(--sun)}
.top p{margin:0;color:var(--dim)}
.list{display:grid;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.row h3{margin:0;font-size:1.05rem;letter-spacing:-.01em}
.row .sub{font-size:.86rem;color:var(--muted)}
.row .pr{text-align:right}
.row .pr b{display:block;font-size:1.5rem;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.row .pr small{font-size:.74rem;color:var(--muted)}
.row .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.tag.xmas{background:#fde7e7;color:#a11d1d}
.btn{font:700 .9rem "Schibsted Grotesk",sans-serif;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.small{font-size:.84rem;color:var(--muted);margin:0}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
</style>
</head>
<body>
<header class="hdr"><div class="in"><a class="logo" href="./"><i></i>Voa Daqui</a><a class="back" href="./">Voos a partir de Portugal</a></div></header>
<div class="band"><div class="in">
  <h1>Voltar a <em>casa</em></h1>
  <p class="lead">Vives lá fora? Os voos mais baratos para Lisboa, Porto, Faro, Madeira e Açores, a partir de 16 cidades em França, Reino Unido, Suíça, Luxemburgo, Bélgica, Alemanha e Países Baixos.</p>
  <p style="margin:14px 0 0"><a href="https://whatsapp.com/channel/0029Vb98MaI4yltSEkpG4R0O" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:#fff;background:#1f8f4e;padding:8px 14px;border-radius:999px;text-decoration:none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.1L4 20z"/></svg>Recebe as pechinchas no WhatsApp</a></p>
</div></div>
<main>
  <section class="card form" aria-label="Escolhas">
    <div><label class="lbl" for="from">Onde vives</label><select id="from"></select></div>
    <div><span class="lbl">Para onde</span><div class="chips" id="to" role="group" aria-label="Destino em Portugal"></div></div>
    <div><span class="lbl">Quando</span><div class="chips" id="when" role="group" aria-label="Quando">
      <button type="button" data-v="all" aria-pressed="true">Todas as datas</button>
      <button type="button" data-v="xmas" aria-pressed="false">Natal e Ano Novo</button>
      <button type="button" data-v="soon" aria-pressed="false">Próximas 4 semanas</button>
      <button type="button" data-v="wk" aria-pressed="false">Fins de semana (até 4 noites)</button>
    </div></div>
  </section>
  <section class="card top" id="top" aria-live="polite"></section>
  <div class="list" id="list"></div>
  <p class="small" id="note"></p>
</main>
<script src="assets/core.js"></script>
<script>
const CITIES = [['França', [['PAR','Paris'],['LYS','Lyon'],['BOD','Bordéus'],['TLS','Toulouse'],['MRS','Marselha'],['NCE','Nice']]], ['Reino Unido', [['LON','Londres'],['MAN','Manchester']]],
  ['Suíça', [['GVA','Genebra'],['ZRH','Zurique'],['BSL','Basileia']]], ['Luxemburgo', [['LUX','Luxemburgo']]], ['Bélgica', [['BRU','Bruxelas']]], ['Alemanha', [['FRA','Frankfurt'],['DUS','Düsseldorf']]], ['Países Baixos', [['AMS','Amesterdão']]]];
const NAME = Object.fromEntries(CITIES.flatMap(c => c[1]));
const DEST = [['any','Todos'],['LIS','Lisboa'],['OPO','Porto'],['FAO','Faro'],['FNC','Madeira'],['PDL','Açores']], DNAME = {LIS:'Lisboa', OPO:'Porto', FAO:'Faro', FNC:'Funchal', PDL:'Ponta Delgada'};
const AL = {FR:'Ryanair',U2:'easyJet',EC:'easyJet',DS:'easyJet',TP:'TAP',VY:'Vueling',HV:'Transavia',TO:'Transavia',LX:'Swiss',AF:'Air France',BA:'British Airways',LG:'Luxair',SN:'Brussels Airlines',LH:'Lufthansa',EW:'Eurowings',W6:'Wizz Air',W4:'Wizz Air',S4:'Azores Airlines',KL:'KLM',IB:'Iberia',UX:'Air Europa',V7:'Volotea',BT:'airBaltic',LS:'Jet2',X3:'TUI'};
const dd = s => { const d = new Date(s.slice(0, 10) + 'T12:00'); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; };
const dash = s => `${s.slice(8, 10)}-${s.slice(5, 7)}-${s.slice(0, 4)}`;
const st = {from: 'PAR', to: 'any', when: 'all'};
try { Object.assign(st, JSON.parse(localStorage.getItem('voa-casa') || '{}')); } catch (e){}
const qs = new URLSearchParams(location.search); if (qs.get('de') && NAME[qs.get('de')]) st.from = qs.get('de'); if (qs.get('para')) st.to = qs.get('para');
$('from').innerHTML = CITIES.map(([c, l]) => `<optgroup label="${esc(c)}">${l.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('')}</optgroup>`).join('');
$('from').value = st.from;
$('to').innerHTML = DEST.map(([k, n]) => `<button type="button" data-v="${k}" aria-pressed="${k === st.to}">${esc(n)}</button>`).join('');
document.querySelectorAll('#when button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.when)));
let DATA = null;
const isXmas = r => { const y = r.dep.slice(0, 4), a = r.dep.slice(5, 10), b = r.ret.slice(5, 10); return (a >= '12-12' && a <= '12-26' && (b >= '12-24' || r.ret.slice(0, 4) > y)); };
function draw(){
  try { localStorage.setItem('voa-casa', JSON.stringify(st)); } catch (e){}
  if (!DATA) return;
  const soon = new Date(Date.now() + 28 * 864e5).toISOString().slice(0, 10);
  let L = DATA.rows.filter(r => r.o === st.from && (st.to === 'any' || r.to === st.to));
  if (st.when === 'xmas') L = L.filter(isXmas);
  if (st.when === 'soon') L = L.filter(r => r.dep.slice(0, 10) <= soon);
  if (st.when === 'wk') L = L.filter(r => r.n <= 4);
  if (st.to === 'any'){ const best = new Map(); for (const r of L){ const k = r.to + r.dep.slice(0, 10) + r.ret.slice(0, 10); if (!best.has(k)) best.set(k, r); } L = [...best.values()]; }
  L.sort((a, b) => a.p - b.p); L = L.slice(0, 20);
  const from = NAME[st.from], xm = DATA.rows.filter(r => r.o === st.from && (st.to === 'any' || r.to === st.to) && isXmas(r)).sort((a, b) => a.p - b.p)[0];
  $('top').innerHTML = L.length ? `<div class="big">${esc(from)} → ${st.to === 'any' ? 'Portugal' : esc(DNAME[st.to])} desde <b>${eur0(L[0].p)}</b></div>
    <p>Ida e volta, por pessoa${xm ? `. No Natal, desde ${eur0(xm.p)} (${dd(xm.dep)} a ${dd(xm.ret)})` : ''}.</p>` : `<div class="big">Sem preços para esta escolha</div><p>Experimenta "Todos" os destinos ou "Todas as datas".</p>`;
  $('list').innerHTML = L.length ? L.map(r => { const al = r.al ? (AL[r.al] || r.al) : '';
    const url = `https://www.kiwi.com/deep?origin=${r.oa}&destination=${r.to}&departure=${dash(r.dep)}&return=${dash(r.ret)}&adults=1&currency=EUR&lang=pt`;
    return `<article class="row"><div><h3>${esc(from)} → ${esc(DNAME[r.to])}</h3><div class="sub">${dd(r.dep)} → ${dd(r.ret)} · ${r.n} noites${al ? ' · ' + esc(al) : ''}${r.st === 0 ? ' · direto' : ''}</div></div>
      <div class="pr"><b>${eur0(r.p)}</b><small>ida e volta</small></div>
      <div class="act">${isXmas(r) ? '<span class="tag xmas">Natal</span>' : ''}${r.oa !== r.o ? `<span class="tag">sai de ${esc(r.oa)}</span>` : ''}<a class="btn primary" href="${url}" target="_blank" rel="noopener">Confirmar no Kiwi</a></div></article>`; }).join('')
    : '<div class="empty">Ainda não há voos guardados para esta combinação.</div>';
  const u = new Date(DATA.updated);
  $('note').textContent = `Preços vistos por outros viajantes nos últimos 2 dias (dados da Aviasales, recolhidos a ${u.getDate()} ${MO[u.getMonth()]}), por pessoa, normalmente só com mochila. Podem já ter mudado: confirma sempre antes de comprar. Os voos para o Natal esgotam depressa.`;
}
$('from').addEventListener('change', e => { st.from = e.target.value; draw(); });
['to', 'when'].forEach(g => $(g).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st[g] = b.dataset.v; $(g).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw(); }));
fetch('data/casa.json?v=' + Date.now()).then(r => r.json()).then(j => { DATA = j; draw(); }).catch(() => { $('top').innerHTML = '<div class="big">Os preços ainda não estão disponíveis</div><p>Volta daqui a pouco.</p>'; });
</script>
<script data-goatcounter="https://voadaqui.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
